services:
  patrimonio-app:
    build:
      context: .
      args:
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-1e2dda32-51f3-42d1-8604-621a01ed4e3a}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-e917adfc-3994-4381-9ab2-0c24c940c6fe}
    container_name: sistema_patrimonio
    restart: always
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
